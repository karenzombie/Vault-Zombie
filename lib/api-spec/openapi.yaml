openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: guest
    description: Account-free, write-only guest prediction flow
  - name: operator
    description: Authenticated operator reveal and scoring operations
  - name: billing
    description: Authenticated operator billing operations
  - name: legal
    description: Legal document configuration and acceptance operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /legal:
    get:
      operationId: getLegalConfiguration
      tags: [legal]
      summary: Get the current public legal document versions and stable URLs
      responses:
        "200":
          description: Current legal configuration
          content: { application/json: { schema: { $ref: "#/components/schemas/LegalConfiguration" } } }
  /legal/status:
    get:
      operationId: getLegalStatus
      tags: [legal]
      summary: Get the signed-in account's current legal acceptance status
      responses:
        "200":
          description: Current legal acceptance status
          content: { application/json: { schema: { $ref: "#/components/schemas/LegalStatus" } } }
        "401": { description: Authentication required }
        "403": { description: Consent is required before local provisioning }
  /legal/signup-intent:
    post:
      operationId: createLegalSignupIntent
      tags: [legal]
      summary: Issue a short-lived one-time server-signed signup acceptance intent
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LegalSignupIntentInput" } } }
      responses:
        "200":
          description: Signed signup acceptance intent
          content: { application/json: { schema: { $ref: "#/components/schemas/LegalSignupIntent" } } }
        "400": { description: Explicit acceptance is required }
        "409": { description: Displayed legal versions are stale }
  /legal/consent:
    post:
      operationId: acceptLegalConsent
      tags: [legal]
      summary: Explicitly accept exactly the current Terms and Privacy Policy versions
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LegalConsentInput" } } }
      responses:
        "200":
          description: Current legal acceptance status
          content: { application/json: { schema: { $ref: "#/components/schemas/LegalStatus" } } }
        "400": { description: Explicit acceptance is required }
        "401": { description: Authentication required }
        "409": { description: Submitted legal versions are stale }
  /guest/{token}:
    get:
      operationId: getGuestVault
      tags: [guest]
      summary: Load the sealed prompt form
      parameters:
        - $ref: "#/components/parameters/GuestToken"
      responses:
        "200":
          description: Public form metadata only; never prediction content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestVault"
        "404":
          description: Link not found
  /guest/{token}/submissions:
    post:
      operationId: submitGuestPrediction
      tags: [guest]
      summary: Atomically seal one guest submission
      parameters:
        - $ref: "#/components/parameters/GuestToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestSubmissionInput"
      responses:
        "201":
          description: Submission sealed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestSubmissionConfirmation"
        "400":
          description: Invalid submission
        "404":
          description: Link not found
        "429":
          description: Rate limit reached
  /email/unsubscribe/{guestId}:
    get:
      operationId: unsubscribeGuestEmail
      tags: [guest]
      summary: Signed one-click guest email unsubscribe
      parameters:
        - $ref: "#/components/parameters/GuestId"
        - name: token
          in: query
          required: true
          schema: { type: string, minLength: 20 }
      responses:
        "200": { description: Guest email preferences updated, content: { text/html: { schema: { type: string } } } }
        "400": { description: Invalid unsubscribe link }
  /operator/vaults/{vaultId}/billing:
    get:
      operationId: getOperatorVaultBillingStatus
      tags: [billing]
      summary: Get billing status for an owned vault
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      responses:
        "200":
          description: Current entitlement and Checkout attempts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VaultBillingStatus" }
        "401": { description: Authentication required }
        "403": { description: Vault is not owned by this operator }
        "404": { description: Vault not found }
  /billing/prices:
    get:
      operationId: getBillingPrices
      tags: [billing]
      summary: Get authoritative Stripe prices for valid vault tier purchases and upgrades
      responses:
        "200":
          description: Fixed active USD Stripe prices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BillingPrice" }
        "503": { description: Stripe billing configuration is unavailable }
  /operator/vaults/{vaultId}/checkout:
    post:
      operationId: createVaultCheckout
      tags: [billing]
      summary: Create one-time Stripe Checkout for an upward vault upgrade
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VaultCheckoutInput" }
      responses:
        "201":
          description: Checkout created; entitlement remains unchanged until webhook verification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VaultCheckoutSession" }
        "400": { description: Target tier is not an upward paid tier }
        "409": { description: A Checkout attempt is already pending for this vault }
        "401": { description: Authentication required }
        "403": { description: Vault is not owned by this operator }
        "404": { description: Vault not found }
        "503": { description: Stripe billing configuration is unavailable }
  /gifts/checkout:
    post:
      operationId: createGiftCheckout
      tags: [billing]
      summary: Create account-free Checkout for a fixed paid-tier gift
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GiftCheckoutInput" } } }
      responses:
        "201": { description: Gift Checkout created, content: { application/json: { schema: { $ref: "#/components/schemas/GiftCheckoutSession" } } } }
        "400": { description: Invalid gift request }
        "503": { description: Stripe billing configuration is unavailable }
  /gifts/{code}/card:
    get:
      operationId: getGiftCard
      tags: [billing]
      summary: Get copyable printable data for a purchased gift
      parameters: [{ $ref: "#/components/parameters/GiftCode" }]
      responses:
        "200": { description: Printable card data, content: { application/json: { schema: { $ref: "#/components/schemas/GiftCard" } } } }
        "404": { description: Gift unavailable }
  /gifts/checkout/sessions/{checkoutSessionId}/card:
    get:
      operationId: getGiftCardByCheckoutSession
      tags: [billing]
      summary: Get purchased gift card data after a Checkout success return
      parameters: [{ $ref: "#/components/parameters/CheckoutSessionId" }]
      responses:
        "200": { description: Purchased printable card data, content: { application/json: { schema: { $ref: "#/components/schemas/GiftCard" } } } }
        "404": { description: Session is unknown or its gift is not purchased }
  /operator/gifts/redeem:
    post:
      operationId: redeemGift
      tags: [billing]
      summary: Atomically redeem a purchased gift into an unspent entitlement at the gifted tier
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RedeemGiftInput" } } }
      responses:
        "200": { description: Gift redeemed, content: { application/json: { schema: { $ref: "#/components/schemas/RedeemGiftResult" } } } }
        "401": { description: Authentication required }
        "404": { description: Gift not found }
        "409": { description: Gift already redeemed or refunded }
        "429": { description: Rate limit reached }
  /operator/entitlements:
    post:
      operationId: startEntitlement
      tags: [billing]
      summary: Start (or reuse) an unspent entitlement at a chosen tier, ahead of creating a vault
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementStartInput" } } }
      responses:
        "201": { description: "Entitlement ready, or Checkout started", content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementStart" } } } }
        "401": { description: Authentication required }
        "503": { description: Stripe billing configuration is unavailable }
  /operator/entitlements/sessions/{checkoutSessionId}:
    get:
      operationId: getEntitlementByCheckoutSession
      tags: [billing]
      summary: Poll an entitlement's Checkout status by session ID after a Stripe return
      parameters: [{ $ref: "#/components/parameters/CheckoutSessionId" }]
      responses:
        "200": { description: Entitlement status, content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementStatus" } } } }
        "401": { description: Authentication required }
        "404": { description: Entitlement not found }
  /operator/vaults/{vaultId}/overage:
    get:
      operationId: getOperatorOverageStatus
      tags: [billing]
      summary: Get prominent unresolved overage status for an owned vault
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      responses:
        "200": { description: Overage status, content: { application/json: { schema: { $ref: "#/components/schemas/OverageStatus" } } } }
        "401": { description: Authentication required }
        "404": { description: Vault not found }
    post:
      operationId: declineOperatorOverage
      tags: [billing]
      summary: Archive newest whole submissions beyond the current cap
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      responses:
        "200": { description: Overage declined, content: { application/json: { schema: { $ref: "#/components/schemas/OverageDeclineResult" } } } }
        "401": { description: Authentication required }
        "404": { description: Vault not found }
  /admin/billing:
    get:
      operationId: listAdminBilling
      tags: [billing]
      summary: List billing records and disputes for administrators
      responses:
        "200": { description: Billing records, content: { application/json: { schema: { $ref: "#/components/schemas/AdminBillingList" } } } }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin]
      summary: Get owner dashboard counts and sealed-content-safe health metadata
      responses:
        "200": { description: "Aggregate counts and health metadata only, never answer values", content: { application/json: { schema: { $ref: "#/components/schemas/AdminDashboard" } } } }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/reports/revenue:
    get:
      operationId: getAdminRevenueReport
      tags: [admin]
      summary: Report locally recorded billing and gift activity for a bounded UTC date period
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: source, in: query, schema: { type: string, enum: [stripe, gift, comp] } }
        - { name: tier, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200": { description: "Local-record revenue metrics; Stripe fees, payouts, and net reconciliation are explicitly unavailable", content: { application/json: { schema: { $ref: "#/components/schemas/AdminRevenueReport" } } } }
        "400": { description: Invalid or unbounded period }
  /admin/operators:
    get:
      operationId: listAdminOperators
      tags: [admin]
      summary: Search operator accounts with safe identity metadata
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { description: Paginated safe account metadata, content: { application/json: { schema: { $ref: "#/components/schemas/AdminOperatorList" } } } }
  /admin/operators/{accountId}:
    get:
      operationId: getAdminOperator
      tags: [admin]
      summary: Get operator-owned vaults and local billing history
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { description: "Safe identity, vault metadata, and billing history only", content: { application/json: { schema: { $ref: "#/components/schemas/AdminOperatorDetail" } } } }
        "404": { description: Operator not found }
  /admin/gifts:
    get:
      operationId: listAdminGifts
      tags: [billing]
      summary: List gift records for administrators
      responses:
        "200": { description: Gift records, content: { application/json: { schema: { $ref: "#/components/schemas/AdminGiftList" } } } }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/gifts/{giftId}:
    get:
      operationId: getAdminGift
      tags: [admin]
      summary: Get gift status, redemption, refund, and delivery support detail
      parameters: [{ $ref: "#/components/parameters/GiftId" }]
      responses:
        "200": { description: Gift state and delivery metadata, content: { application/json: { schema: { $ref: "#/components/schemas/AdminGiftDetail" } } } }
        "404": { description: Gift not found }
  /admin/overages:
    get:
      operationId: listAdminOverages
      tags: [billing]
      summary: List administrative overage event history
      responses:
        "200": { description: Overage events, content: { application/json: { schema: { $ref: "#/components/schemas/AdminOverageList" } } } }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/email-deliveries:
    get:
      operationId: listAdminEmailDeliveries
      tags: [billing]
      summary: List transactional email delivery status and failures
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [queued, sending, sent, failed, suppressed] } }
        - { name: eventType, in: query, schema: { type: string, maxLength: 100 } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 250, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { description: Email deliveries, content: { application/json: { schema: { $ref: "#/components/schemas/AdminEmailDeliveryList" } } } }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/email-deliveries/{emailDeliveryId}:
    get:
      operationId: getAdminEmailDelivery
      tags: [admin]
      summary: Get delivery support detail without email payload content
      parameters:
        - name: emailDeliveryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Delivery metadata and error state, content: { application/json: { schema: { $ref: "#/components/schemas/AdminEmailDeliveryDetail" } } } }
        "404": { description: Delivery not found }
  /admin/email-deliveries/{emailDeliveryId}/retry:
    post:
      operationId: retryAdminEmailDelivery
      tags: [billing]
      summary: Fresh-MFA retry of a failed transactional email with a typed reason
      parameters:
        - name: emailDeliveryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SensitiveReasonInput" } } }
      responses:
        "200": { description: Delivery queued, content: { application/json: { schema: { $ref: "#/components/schemas/EmailRetryResult" } } } }
        "400": { description: Delivery is not safe to retry }
  /admin/gifts/{giftId}/resend:
    post:
      operationId: resendAdminGift
      tags: [billing]
      summary: Fresh-MFA resend of a purchased gift delivery with a typed reason
      parameters: [{ $ref: "#/components/parameters/GiftId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GiftResendInput" } } }
      responses:
        "200": { description: Fresh gift delivery queued, content: { application/json: { schema: { $ref: "#/components/schemas/GiftResendResult" } } } }
        "400": { description: Gift has no gifter email or is not deliverable }
  /admin/billing/{billingRecordId}/refund:
    post:
      operationId: refundBillingRecord
      tags: [billing]
      summary: Fresh-MFA admin full refund with a typed reason
      parameters: [{ $ref: "#/components/parameters/BillingRecordId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RefundRequestInput" } } }
      responses:
        "200": { description: Refund confirmed, content: { application/json: { schema: { $ref: "#/components/schemas/AdminBillingActionResult" } } } }
        "400": { description: Billing record cannot be refunded }
        "409": { description: Already refunded }
        "503": { description: Stripe refund was not confirmed }
  /admin/gifts/{giftId}/refund:
    post:
      operationId: refundGift
      tags: [billing]
      summary: Fresh-MFA admin refund of an unredeemed gift within ninety days
      parameters: [{ $ref: "#/components/parameters/GiftId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RefundRequestInput" } } }
      responses:
        "200": { description: Gift refund confirmed, content: { application/json: { schema: { $ref: "#/components/schemas/GiftRefundResult" } } } }
        "400": { description: Gift is ineligible for refund }
        "409": { description: Gift already redeemed or refunded }
        "503": { description: Stripe refund was not confirmed }
  /admin/vaults/{vaultId}/comp-grant:
    post:
      operationId: grantVaultComp
      tags: [billing]
      summary: Fresh-MFA admin paid-tier comp grant
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CompGrantInput" } } }
      responses:
        "200": { description: Comp granted, content: { application/json: { schema: { $ref: "#/components/schemas/AdminBillingActionResult" } } } }
        "400": { description: Target is not monotonic }
  /admin/vaults:
    get:
      operationId: listAdminVaults
      tags: [admin]
      summary: List safe vault health metadata for administrators
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        "200": { description: "Vault metadata only, never prediction content", content: { application/json: { schema: { $ref: "#/components/schemas/AdminVaultList" } } } }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/vaults/archive:
    get:
      operationId: listAdminDeletedVaults
      tags: [admin]
      summary: List soft-deleted vaults, separate from the live vault list
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        "200": { description: "Deleted vault metadata only", content: { application/json: { schema: { $ref: "#/components/schemas/AdminVaultList" } } } }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/vaults/{vaultId}/restore:
    post:
      operationId: restoreAdminVault
      tags: [admin]
      summary: Fresh-MFA audited restoration of a soft-deleted vault to its prior status
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SensitiveReasonInput" } } } }
      responses:
        "200": { description: "Vault restored", content: { application/json: { schema: { $ref: "#/components/schemas/AdminVaultList/properties/vaults/items" } } } }
        "400": { description: Vault is not deleted }
        "404": { description: Vault not found }
  /admin/content:
    get:
      operationId: listAdminContent
      tags: [admin]
      summary: List searchable content-management metadata
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
      responses:
        "200": { description: Content hierarchy metadata, content: { application/json: { schema: { $ref: "#/components/schemas/AdminContentList" } } } }
  /admin/content/import/preview:
    post:
      operationId: previewAdminContentImport
      tags: [admin]
      summary: Non-mutating strict question-bank import preview
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContentImportRequest" } } } }
      responses:
        "200": { description: Validation findings, content: { application/json: { schema: { $ref: "#/components/schemas/ContentImportPreview" } } } }
  /admin/content/import/validate:
    post:
      operationId: validateAdminContentImport
      tags: [admin]
      summary: Strict non-mutating question-bank validation
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContentImportRequest" } } } }
      responses:
        "200": { description: Validation findings, content: { application/json: { schema: { $ref: "#/components/schemas/ContentImportPreview" } } } }
  /admin/content/import/apply:
    post:
      operationId: applyAdminContentImport
      tags: [admin]
      summary: Fresh-MFA audited all-or-nothing valid question-bank import
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContentImportApplyRequest" } } } }
      responses:
        "201": { description: Entire bank imported, content: { application/json: { schema: { $ref: "#/components/schemas/ContentImportResult" } } } }
        "400": { description: Import has unresolved validation issues }
  /admin/content/{kind}:
    post:
      operationId: createAdminContentItem
      tags: [admin]
      summary: Fresh-MFA audited creation of a content item
      parameters: [{ $ref: "#/components/parameters/ContentKind" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContentMutationInput" } } } }
      responses: { "201": { description: Created content item, content: { application/json: { schema: { $ref: "#/components/schemas/ContentItem" } } } } }
  /admin/content/{kind}/{contentId}:
    patch:
      operationId: updateAdminContentItem
      tags: [admin]
      summary: Fresh-MFA audited content update; permanent IDs remain unchanged
      parameters: [{ $ref: "#/components/parameters/ContentKind" }, { $ref: "#/components/parameters/ContentId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContentMutationInput" } } } }
      responses: { "200": { description: Updated content item, content: { application/json: { schema: { $ref: "#/components/schemas/ContentItem" } } } } }
  /admin/content/{kind}/{contentId}/{state}:
    post:
      operationId: setAdminContentRetirement
      tags: [admin]
      summary: Fresh-MFA audited retirement or reactivation; never deletes content
      parameters: [{ $ref: "#/components/parameters/ContentKind" }, { $ref: "#/components/parameters/ContentId" }, { $ref: "#/components/parameters/ContentRetirementState" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SensitiveReasonInput" } } } }
      responses: { "200": { description: Content retirement state updated, content: { application/json: { schema: { $ref: "#/components/schemas/ContentItem" } } } } }
  /admin/content/{kind}/reorder:
    post:
      operationId: reorderAdminContent
      tags: [admin]
      summary: Fresh-MFA audited complete sibling reorder
      parameters: [{ $ref: "#/components/parameters/ContentKind" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContentReorderInput" } } } }
      responses: { "200": { description: Reordered content IDs, content: { application/json: { schema: { $ref: "#/components/schemas/ContentReorderResult" } } } } }
  /admin/vaults/{vaultId}:
    get:
      operationId: getAdminVault
      tags: [admin]
      summary: Get safe vault health metadata and reveal scope previews
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      responses:
        "200": { description: "Metadata and counts only", content: { application/json: { schema: { $ref: "#/components/schemas/AdminVaultDetail" } } } }
        "404": { description: Vault not found }
  /admin/vaults/{vaultId}/support:
    get:
      operationId: getAdminVaultSupportDetail
      tags: [admin]
      summary: Get vault entitlement, local billing, overage, and email support status
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      responses:
        "200": { description: Vault support metadata only; never sealed answer values, content: { application/json: { schema: { $ref: "#/components/schemas/AdminVaultSupportDetail" } } } }
        "404": { description: Vault not found }
  /admin/vaults/{vaultId}/guests:
    get:
      operationId: listAdminVaultGuests
      tags: [admin]
      summary: List guests' email subscription status for a vault; never includes answers
