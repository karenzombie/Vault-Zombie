openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: guest
    description: Account-free, write-only guest prediction flow
  - name: operator
    description: Authenticated operator reveal and scoring operations
  - name: billing
    description: Authenticated operator billing operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /guest/{token}:
    get:
      operationId: getGuestVault
      tags: [guest]
      summary: Load the sealed prompt form
      parameters:
        - $ref: "#/components/parameters/GuestToken"
      responses:
        "200":
          description: Public form metadata only; never prediction content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestVault"
        "404":
          description: Link not found
  /guest/{token}/submissions:
    post:
      operationId: submitGuestPrediction
      tags: [guest]
      summary: Atomically seal one guest submission
      parameters:
        - $ref: "#/components/parameters/GuestToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestSubmissionInput"
      responses:
        "201":
          description: Submission sealed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestSubmissionConfirmation"
        "400":
          description: Invalid submission
        "404":
          description: Link not found
        "429":
          description: Rate limit reached
  /email/unsubscribe/{guestId}:
    get:
      operationId: unsubscribeGuestEmail
      tags: [guest]
      summary: Signed one-click guest email unsubscribe
      parameters:
        - $ref: "#/components/parameters/GuestId"
        - name: token
          in: query
          required: true
          schema: { type: string, minLength: 20 }
      responses:
        "200": { description: Guest email preferences updated, content: { text/html: { schema: { type: string } } } }
        "400": { description: Invalid unsubscribe link }
  /operator/vaults/{vaultId}/billing:
    get:
      operationId: getOperatorVaultBillingStatus
      tags: [billing]
      summary: Get billing status for an owned vault
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      responses:
        "200":
          description: Current entitlement and Checkout attempts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VaultBillingStatus" }
        "401": { description: Authentication required }
        "403": { description: Vault is not owned by this operator }
        "404": { description: Vault not found }
  /billing/prices:
    get:
      operationId: getBillingPrices
      tags: [billing]
      summary: Get authoritative Stripe prices for valid vault tier purchases and upgrades
      responses:
        "200":
          description: Fixed active USD Stripe prices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BillingPrice" }
        "503": { description: Stripe billing configuration is unavailable }
  /operator/vaults/{vaultId}/checkout:
    post:
      operationId: createVaultCheckout
      tags: [billing]
      summary: Create one-time Stripe Checkout for an upward vault upgrade
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VaultCheckoutInput" }
      responses:
        "201":
          description: Checkout created; entitlement remains unchanged until webhook verification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VaultCheckoutSession" }
        "400": { description: Target tier is not an upward paid tier }
        "409": { description: A Checkout attempt is already pending for this vault }
        "401": { description: Authentication required }
        "403": { description: Vault is not owned by this operator }
        "404": { description: Vault not found }
        "503": { description: Stripe billing configuration is unavailable }
  /gifts/checkout:
    post:
      operationId: createGiftCheckout
      tags: [billing]
      summary: Create account-free Checkout for a fixed paid-tier gift
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GiftCheckoutInput" } } }
      responses:
        "201": { description: Gift Checkout created, content: { application/json: { schema: { $ref: "#/components/schemas/GiftCheckoutSession" } } } }
        "400": { description: Invalid gift request }
        "503": { description: Stripe billing configuration is unavailable }
  /gifts/{code}/card:
    get:
      operationId: getGiftCard
      tags: [billing]
      summary: Get copyable printable data for a purchased gift
      parameters: [{ $ref: "#/components/parameters/GiftCode" }]
      responses:
        "200": { description: Printable card data, content: { application/json: { schema: { $ref: "#/components/schemas/GiftCard" } } } }
        "404": { description: Gift unavailable }
  /gifts/checkout/sessions/{checkoutSessionId}/card:
    get:
      operationId: getGiftCardByCheckoutSession
      tags: [billing]
      summary: Get purchased gift card data after a Checkout success return
      parameters: [{ $ref: "#/components/parameters/CheckoutSessionId" }]
      responses:
        "200": { description: Purchased printable card data, content: { application/json: { schema: { $ref: "#/components/schemas/GiftCard" } } } }
        "404": { description: Session is unknown or its gift is not purchased }
  /operator/gifts/redeem:
    post:
      operationId: redeemGift
      tags: [billing]
      summary: Atomically redeem a purchased gift to an owned draft vault
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RedeemGiftInput" } } }
      responses:
        "200": { description: Gift redeemed, content: { application/json: { schema: { $ref: "#/components/schemas/RedeemGiftResult" } } } }
        "400": { description: Gift cannot be redeemed to this vault }
        "401": { description: Authentication required }
        "404": { description: Gift or vault not found }
        "409": { description: Gift already redeemed or refunded }
        "429": { description: Rate limit reached }
  /operator/vaults/{vaultId}/overage:
    get:
      operationId: getOperatorOverageStatus
      tags: [billing]
      summary: Get prominent unresolved overage status for an owned vault
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      responses:
        "200": { description: Overage status, content: { application/json: { schema: { $ref: "#/components/schemas/OverageStatus" } } } }
        "401": { description: Authentication required }
        "404": { description: Vault not found }
    post:
      operationId: declineOperatorOverage
      tags: [billing]
      summary: Archive newest whole submissions beyond the current cap
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      responses:
        "200": { description: Overage declined, content: { application/json: { schema: { $ref: "#/components/schemas/OverageDeclineResult" } } } }
        "401": { description: Authentication required }
        "404": { description: Vault not found }
  /admin/billing:
    get:
      operationId: listAdminBilling
      tags: [billing]
      summary: List billing records and disputes for administrators
      responses:
        "200": { description: Billing records, content: { application/json: { schema: { $ref: "#/components/schemas/AdminBillingList" } } } }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/gifts:
    get:
      operationId: listAdminGifts
      tags: [billing]
      summary: List gift records for administrators
      responses:
        "200": { description: Gift records, content: { application/json: { schema: { $ref: "#/components/schemas/AdminGiftList" } } } }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/overages:
    get:
      operationId: listAdminOverages
      tags: [billing]
      summary: List administrative overage event history
      responses:
        "200": { description: Overage events, content: { application/json: { schema: { $ref: "#/components/schemas/AdminOverageList" } } } }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/email-deliveries:
    get:
      operationId: listAdminEmailDeliveries
      tags: [billing]
      summary: List transactional email delivery status and failures
      responses:
        "200": { description: Email deliveries, content: { application/json: { schema: { $ref: "#/components/schemas/AdminEmailDeliveryList" } } } }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/email-deliveries/{emailDeliveryId}/retry:
    post:
      operationId: retryAdminEmailDelivery
      tags: [billing]
      summary: Fresh-MFA retry of a failed transactional email with a typed reason
      parameters:
        - name: emailDeliveryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SensitiveReasonInput" } } }
      responses:
        "200": { description: Delivery queued, content: { application/json: { schema: { $ref: "#/components/schemas/EmailRetryResult" } } } }
        "400": { description: Delivery is not safe to retry }
  /admin/gifts/{giftId}/resend:
    post:
      operationId: resendAdminGift
      tags: [billing]
      summary: Fresh-MFA resend of a purchased gift delivery with a typed reason
      parameters: [{ $ref: "#/components/parameters/GiftId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GiftResendInput" } } }
      responses:
        "200": { description: Fresh gift delivery queued, content: { application/json: { schema: { $ref: "#/components/schemas/GiftResendResult" } } } }
        "400": { description: Gift has no gifter email or is not deliverable }
  /admin/billing/{billingRecordId}/refund:
    post:
      operationId: refundBillingRecord
      tags: [billing]
      summary: Fresh-MFA admin full refund with a typed reason
      parameters: [{ $ref: "#/components/parameters/BillingRecordId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SensitiveReasonInput" } } }
      responses:
        "200": { description: Refund confirmed, content: { application/json: { schema: { $ref: "#/components/schemas/AdminBillingActionResult" } } } }
        "400": { description: Billing record cannot be refunded }
        "409": { description: Already refunded }
        "503": { description: Stripe refund was not confirmed }
  /admin/gifts/{giftId}/refund:
    post:
      operationId: refundGift
      tags: [billing]
      summary: Fresh-MFA admin refund of an unredeemed gift within ninety days
      parameters: [{ $ref: "#/components/parameters/GiftId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SensitiveReasonInput" } } }
      responses:
        "200": { description: Gift refund confirmed, content: { application/json: { schema: { $ref: "#/components/schemas/GiftRefundResult" } } } }
        "400": { description: Gift is ineligible for refund }
        "409": { description: Gift already redeemed or refunded }
        "503": { description: Stripe refund was not confirmed }
  /admin/vaults/{vaultId}/comp-grant:
    post:
      operationId: grantVaultComp
      tags: [billing]
      summary: Fresh-MFA admin paid-tier comp grant
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CompGrantInput" } } }
      responses:
        "200": { description: Comp granted, content: { application/json: { schema: { $ref: "#/components/schemas/AdminBillingActionResult" } } } }
        "400": { description: Target is not monotonic }
  /operator/vaults/{vaultId}/reveals/unlocked:
    get:
      operationId: listUnlockedRevealWork
      tags: [operator]
      summary: List unlocked reveal work for an owned vault
      parameters:
        - $ref: "#/components/parameters/VaultId"
      responses:
        "200":
          description: Unlocked answers grouped into question work items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlockedRevealWork"
        "401": { description: Authentication required }
        "403": { description: Vault is not owned by this operator }
        "404": { description: Vault not found }
  /operator/vaults/{vaultId}/reveals/{revealSlotId}/questions/{vaultQuestionId}/outcome:
    put:
      operationId: resolveRevealQuestionOutcome
      tags: [operator]
      summary: Atomically save a question outcome and automatic verdicts
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - $ref: "#/components/parameters/RevealSlotId"
        - $ref: "#/components/parameters/VaultQuestionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutcomeInput" }
      responses:
        "200":
          description: Outcome resolved idempotently
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedOutcome" }
        "400": { description: Invalid outcome for question type }
        "401": { description: Authentication required }
        "403": { description: Vault is not owned by this operator }
        "404": { description: Unlocked reveal question not found }
  /operator/vaults/{vaultId}/reveals/{revealSlotId}/questions/{vaultQuestionId}/clusters/{clusterKey}/verdict:
    put:
      operationId: overrideRevealTextClusterVerdict
      tags: [operator]
      summary: Confirm or override one free-text answer cluster
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - $ref: "#/components/parameters/RevealSlotId"
        - $ref: "#/components/parameters/VaultQuestionId"
        - name: clusterKey
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 140 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClusterVerdictInput" }
      responses:
        "200":
          description: Cluster verdict saved idempotently
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterVerdictResult" }
        "400": { description: Cluster is not scoreable }
        "401": { description: Authentication required }
        "403": { description: Vault is not owned by this operator }
        "404": { description: Unlocked cluster or resolved outcome not found }
  /operator/vaults/{vaultId}/scoreboard:
    get:
      operationId: getOperatorScoreboard
      tags: [operator]
      summary: Get the scored unlocked-answer scoreboard for an owned vault
      parameters:
        - $ref: "#/components/parameters/VaultId"
      responses:
        "200":
          description: Scoreboard totals, with full worth one and half worth one half
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scoreboard" }
        "401": { description: Authentication required }
        "403": { description: Vault is not owned by this operator }
        "404": { description: Vault not found }
  /operator/vaults/{vaultId}/reports/health:
    get:
      operationId: getVaultHealthReport
      tags: [operator]
      summary: Get vault health counts and metadata only
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      responses:
        "200": { description: Health metadata with no prediction content, content: { application/json: { schema: { $ref: "#/components/schemas/VaultHealthReport" } } } }
        "401": { description: Authentication required }
        "403": { description: Vault is not owned by this operator }
        "404": { description: Vault not found }
  /operator/vaults/{vaultId}/reports/reveals/{revealSlotId}:
    get:
      operationId: getRevealReport
      tags: [operator]
      summary: Get the unlocked report for one reveal
      parameters: [{ $ref: "#/components/parameters/VaultId" }, { $ref: "#/components/parameters/RevealSlotId" }]
      responses:
        "200": { description: Unlocked reveal report, content: { application/json: { schema: { $ref: "#/components/schemas/RevealReport" } } } }
        "401": { description: Authentication required }
        "403": { description: Vault is not owned by this operator }
        "404": { description: Vault or reveal not found }
  /operator/vaults/{vaultId}/reports/questions/{vaultQuestionId}:
    get:
      operationId: getQuestionReport
      tags: [operator]
      summary: Get unlocked detail for one question
      parameters: [{ $ref: "#/components/parameters/VaultId" }, { $ref: "#/components/parameters/VaultQuestionId" }]
      responses:
        "200": { description: Unlocked question detail, content: { application/json: { schema: { $ref: "#/components/schemas/QuestionReport" } } } }
        "401": { description: Authentication required }
        "403": { description: Vault is not owned by this operator }
        "404": { description: Vault or unlocked question not found }
  /operator/vaults/{vaultId}/reports/guests/{guestId}:
    get:
      operationId: getGuestPersonalReport
      tags: [operator]
      summary: Get an email-eligible guest personal report
      parameters: [{ $ref: "#/components/parameters/VaultId" }, { $ref: "#/components/parameters/GuestId" }]
      responses:
        "200": { description: Personal results without email address, content: { application/json: { schema: { $ref: "#/components/schemas/GuestPersonalReport" } } } }
        "401": { description: Authentication required }
        "403": { description: Vault is not owned by this operator }
        "404": { description: "Guest is absent, has no email, or vault not found" }
  /operator/vaults/{vaultId}/reports/summary:
    get:
      operationId: getVaultResultsSummary
      tags: [operator]
      summary: Get tier-appropriate unlocked results summary
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      responses:
        "200": { description: Lockbox trimmed or paid full summary, content: { application/json: { schema: { $ref: "#/components/schemas/VaultResultsSummary" } } } }
        "401": { description: Authentication required }
        "403": { description: Vault is not owned by this operator }
        "404": { description: Vault not found }
  /operator/vaults/{vaultId}/reports/areas:
    get:
      operationId: getAreaReport
      tags: [operator]
      summary: Get paid by-area breakdown
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      responses: { "200": { description: Area report, content: { application/json: { schema: { $ref: "#/components/schemas/AreaReport" } } } }, "401": { description: Authentication required }, "403": { description: Paid plan and ownership required }, "404": { description: Vault not found } }
  /operator/vaults/{vaultId}/reports/timeline:
    get:
      operationId: getTimelineReport
      tags: [operator]
      summary: Get paid reveal timeline
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      responses: { "200": { description: Timeline report, content: { application/json: { schema: { $ref: "#/components/schemas/TimelineReport" } } } }, "401": { description: Authentication required }, "403": { description: Paid plan and ownership required }, "404": { description: Vault not found } }
  /operator/vaults/{vaultId}/reports/archive:
    get:
      operationId: getAnswersArchive
      tags: [operator]
      summary: Get paid compiled unlocked answers archive
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      responses: { "200": { description: Archive, content: { application/json: { schema: { $ref: "#/components/schemas/AnswersArchive" } } } }, "401": { description: Authentication required }, "403": { description: Paid plan and ownership required }, "404": { description: Vault not found } }
  /operator/vaults/{vaultId}/reports/finale:
    get:
      operationId: getFinaleReport
      tags: [operator]
      summary: Get paid finale archive
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      responses: { "200": { description: Finale report, content: { application/json: { schema: { $ref: "#/components/schemas/FinaleReport" } } } }, "401": { description: Authentication required }, "403": { description: Paid plan and ownership required }, "404": { description: Vault not found } }
  /operator/vaults/{vaultId}/reports/print:
    get:
      operationId: getPrintArchive
      tags: [operator]
      summary: Get paid printable archive DTO
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      responses: { "200": { description: Print archive, content: { application/json: { schema: { $ref: "#/components/schemas/FinaleReport" } } } }, "401": { description: Authentication required }, "403": { description: Paid plan and ownership required }, "404": { description: Vault not found } }
components:
  parameters:
    VaultId:
      name: vaultId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RevealSlotId:
      name: revealSlotId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VaultQuestionId:
      name: vaultQuestionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GuestToken:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 32, maxLength: 256 }
    GuestId:
      name: guestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GiftCode:
      name: code
      in: path
      required: true
      schema: { type: string, minLength: 12, maxLength: 64 }
    BillingRecordId:
      name: billingRecordId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GiftId:
      name: giftId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CheckoutSessionId:
      name: checkoutSessionId
      in: path
      required: true
      schema: { type: string, minLength: 8, maxLength: 255, pattern: "^cs_" }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    VaultCheckoutInput:
      type: object
      required: [targetTier]
      properties:
        targetTier: { type: string, enum: [safe, vault, deep_vault] }
    GiftCheckoutInput:
      type: object
      required: [targetTier]
      properties:
        targetTier: { type: string, enum: [safe, vault, deep_vault] }
        fromLine: { type: string, maxLength: 80 }
        toLine: { type: string, maxLength: 80 }
        gifterEmail: { type: string, format: email }
    BillingPrice:
      type: object
      required: [fromTier, targetTier, amountCents, currency]
      properties:
        fromTier: { type: string, enum: [lockbox, safe, vault] }
        targetTier: { type: string, enum: [safe, vault, deep_vault] }
        amountCents: { type: integer, minimum: 1 }
        currency: { type: string, enum: [usd] }
    GiftCheckoutSession:
      type: object
      required: [giftId, checkoutUrl, status]
      properties:
        giftId: { type: string, format: uuid }
        checkoutUrl: { type: string, format: uri }
        status: { type: string, enum: [pending] }
    GiftCard:
      type: object
      required: [logo, line, tierName, code, redemptionUrl, description]
      properties:
        logo: { type: string }
        line: { type: string }
        tierName: { type: string }
        code: { type: string }
        redemptionUrl: { type: string, format: uri }
        fromLine: { type: ["string", "null"] }
        toLine: { type: ["string", "null"] }
        description: { type: string }
    RedeemGiftInput:
      type: object
      required: [code, vaultId]
      properties:
        code: { type: string, minLength: 12, maxLength: 64 }
        vaultId: { type: string, format: uuid }
    RedeemGiftResult:
      type: object
      required: [vaultId, billingRecordId, tier]
      properties:
        vaultId: { type: string, format: uuid }
        billingRecordId: { type: string, format: uuid }
        tier: { type: string, enum: [safe, vault, deep_vault] }
    OverageStatus:
      type: object
      required: [vaultId, heldSubmissionCount, unresolved, nearestRevealDate]
      properties:
        vaultId: { type: string, format: uuid }
        heldSubmissionCount: { type: integer }
        unresolved: { type: boolean }
        nearestRevealDate: { type: ["string", "null"], format: date }
    OverageDeclineResult:
      type: object
      required: [archivedSubmissionCount]
      properties: { archivedSubmissionCount: { type: integer } }
    SensitiveReasonInput:
      type: object
      required: [reason]
      properties: { reason: { type: string, minLength: 1, maxLength: 1000 } }
    GiftResendInput:
      allOf:
        - $ref: "#/components/schemas/SensitiveReasonInput"
        - type: object
          required: [requestId]
          properties: { requestId: { type: string, format: uuid } }
    CompGrantInput:
      allOf:
        - $ref: "#/components/schemas/SensitiveReasonInput"
        - type: object
          required: [targetTier]
          properties: { targetTier: { type: string, enum: [safe, vault, deep_vault] } }
    AdminBillingActionResult:
      type: object
      required: [billingRecordId, vaultId, status, currentTier]
      properties:
        billingRecordId: { type: string, format: uuid }
        vaultId: { type: string, format: uuid }
        status: { type: string, enum: [refunded, comped] }
        currentTier: { type: string, enum: [lockbox, safe, vault, deep_vault] }
    AdminBillingList:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items:
            type: object
