openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: guest
    description: Account-free, write-only guest prediction flow
  - name: operator
    description: Authenticated operator reveal and scoring operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /guest/{token}:
    get:
      operationId: getGuestVault
      tags: [guest]
      summary: Load the sealed prompt form
      parameters:
        - $ref: "#/components/parameters/GuestToken"
      responses:
        "200":
          description: Public form metadata only; never prediction content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestVault"
        "404":
          description: Link not found
  /guest/{token}/submissions:
    post:
      operationId: submitGuestPrediction
      tags: [guest]
      summary: Atomically seal one guest submission
      parameters:
        - $ref: "#/components/parameters/GuestToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestSubmissionInput"
      responses:
        "201":
          description: Submission sealed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestSubmissionConfirmation"
        "400":
          description: Invalid submission
        "404":
          description: Link not found
        "429":
          description: Rate limit reached
  /operator/vaults/{vaultId}/reveals/unlocked:
    get:
      operationId: listUnlockedRevealWork
      tags: [operator]
      summary: List unlocked reveal work for an owned vault
      parameters:
        - $ref: "#/components/parameters/VaultId"
      responses:
        "200":
          description: Unlocked answers grouped into question work items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlockedRevealWork"
        "401": { description: Authentication required }
        "403": { description: Vault is not owned by this operator }
        "404": { description: Vault not found }
  /operator/vaults/{vaultId}/reveals/{revealSlotId}/questions/{vaultQuestionId}/outcome:
    put:
      operationId: resolveRevealQuestionOutcome
      tags: [operator]
      summary: Atomically save a question outcome and automatic verdicts
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - $ref: "#/components/parameters/RevealSlotId"
        - $ref: "#/components/parameters/VaultQuestionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutcomeInput" }
      responses:
        "200":
          description: Outcome resolved idempotently
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedOutcome" }
        "400": { description: Invalid outcome for question type }
        "401": { description: Authentication required }
        "403": { description: Vault is not owned by this operator }
        "404": { description: Unlocked reveal question not found }
  /operator/vaults/{vaultId}/reveals/{revealSlotId}/questions/{vaultQuestionId}/clusters/{clusterKey}/verdict:
    put:
      operationId: overrideRevealTextClusterVerdict
      tags: [operator]
      summary: Confirm or override one free-text answer cluster
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - $ref: "#/components/parameters/RevealSlotId"
        - $ref: "#/components/parameters/VaultQuestionId"
        - name: clusterKey
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 140 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClusterVerdictInput" }
      responses:
        "200":
          description: Cluster verdict saved idempotently
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterVerdictResult" }
        "400": { description: Cluster is not scoreable }
        "401": { description: Authentication required }
        "403": { description: Vault is not owned by this operator }
        "404": { description: Unlocked cluster or resolved outcome not found }
  /operator/vaults/{vaultId}/scoreboard:
    get:
      operationId: getOperatorScoreboard
      tags: [operator]
      summary: Get the scored unlocked-answer scoreboard for an owned vault
      parameters:
        - $ref: "#/components/parameters/VaultId"
      responses:
        "200":
          description: Scoreboard totals, with full worth one and half worth one half
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scoreboard" }
        "401": { description: Authentication required }
        "403": { description: Vault is not owned by this operator }
        "404": { description: Vault not found }
  /operator/vaults/{vaultId}/reports/health:
    get:
      operationId: getVaultHealthReport
      tags: [operator]
      summary: Get vault health counts and metadata only
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      responses:
        "200": { description: Health metadata with no prediction content, content: { application/json: { schema: { $ref: "#/components/schemas/VaultHealthReport" } } } }
        "401": { description: Authentication required }
        "403": { description: Vault is not owned by this operator }
        "404": { description: Vault not found }
  /operator/vaults/{vaultId}/reports/reveals/{revealSlotId}:
    get:
      operationId: getRevealReport
      tags: [operator]
      summary: Get the unlocked report for one reveal
      parameters: [{ $ref: "#/components/parameters/VaultId" }, { $ref: "#/components/parameters/RevealSlotId" }]
      responses:
        "200": { description: Unlocked reveal report, content: { application/json: { schema: { $ref: "#/components/schemas/RevealReport" } } } }
        "401": { description: Authentication required }
        "403": { description: Vault is not owned by this operator }
        "404": { description: Vault or reveal not found }
  /operator/vaults/{vaultId}/reports/questions/{vaultQuestionId}:
    get:
      operationId: getQuestionReport
      tags: [operator]
      summary: Get unlocked detail for one question
      parameters: [{ $ref: "#/components/parameters/VaultId" }, { $ref: "#/components/parameters/VaultQuestionId" }]
      responses:
        "200": { description: Unlocked question detail, content: { application/json: { schema: { $ref: "#/components/schemas/QuestionReport" } } } }
        "401": { description: Authentication required }
        "403": { description: Vault is not owned by this operator }
        "404": { description: Vault or unlocked question not found }
  /operator/vaults/{vaultId}/reports/guests/{guestId}:
    get:
      operationId: getGuestPersonalReport
      tags: [operator]
      summary: Get an email-eligible guest personal report
      parameters: [{ $ref: "#/components/parameters/VaultId" }, { $ref: "#/components/parameters/GuestId" }]
      responses:
        "200": { description: Personal results without email address, content: { application/json: { schema: { $ref: "#/components/schemas/GuestPersonalReport" } } } }
        "401": { description: Authentication required }
        "403": { description: Vault is not owned by this operator }
        "404": { description: "Guest is absent, has no email, or vault not found" }
  /operator/vaults/{vaultId}/reports/summary:
    get:
      operationId: getVaultResultsSummary
      tags: [operator]
      summary: Get tier-appropriate unlocked results summary
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      responses:
        "200": { description: Lockbox trimmed or paid full summary, content: { application/json: { schema: { $ref: "#/components/schemas/VaultResultsSummary" } } } }
        "401": { description: Authentication required }
        "403": { description: Vault is not owned by this operator }
        "404": { description: Vault not found }
  /operator/vaults/{vaultId}/reports/areas:
    get:
      operationId: getAreaReport
      tags: [operator]
      summary: Get paid by-area breakdown
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      responses: { "200": { description: Area report, content: { application/json: { schema: { $ref: "#/components/schemas/AreaReport" } } } }, "401": { description: Authentication required }, "403": { description: Paid plan and ownership required }, "404": { description: Vault not found } }
  /operator/vaults/{vaultId}/reports/timeline:
    get:
      operationId: getTimelineReport
      tags: [operator]
      summary: Get paid reveal timeline
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      responses: { "200": { description: Timeline report, content: { application/json: { schema: { $ref: "#/components/schemas/TimelineReport" } } } }, "401": { description: Authentication required }, "403": { description: Paid plan and ownership required }, "404": { description: Vault not found } }
  /operator/vaults/{vaultId}/reports/archive:
    get:
      operationId: getAnswersArchive
      tags: [operator]
      summary: Get paid compiled unlocked answers archive
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      responses: { "200": { description: Archive, content: { application/json: { schema: { $ref: "#/components/schemas/AnswersArchive" } } } }, "401": { description: Authentication required }, "403": { description: Paid plan and ownership required }, "404": { description: Vault not found } }
  /operator/vaults/{vaultId}/reports/finale:
    get:
      operationId: getFinaleReport
      tags: [operator]
      summary: Get paid finale archive
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      responses: { "200": { description: Finale report, content: { application/json: { schema: { $ref: "#/components/schemas/FinaleReport" } } } }, "401": { description: Authentication required }, "403": { description: Paid plan and ownership required }, "404": { description: Vault not found } }
  /operator/vaults/{vaultId}/reports/print:
    get:
      operationId: getPrintArchive
      tags: [operator]
      summary: Get paid printable archive DTO
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      responses: { "200": { description: Print archive, content: { application/json: { schema: { $ref: "#/components/schemas/FinaleReport" } } } }, "401": { description: Authentication required }, "403": { description: Paid plan and ownership required }, "404": { description: Vault not found } }
components:
  parameters:
    VaultId:
      name: vaultId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RevealSlotId:
      name: revealSlotId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VaultQuestionId:
      name: vaultQuestionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GuestToken:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 32, maxLength: 256 }
    GuestId:
      name: guestId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GuestOption:
      type: object
      required: [id, label]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
    GuestQuestion:
      type: object
      required: [id, prompt, answerType, displayOrder, options]
      properties:
        id: { type: string, format: uuid }
        prompt: { type: string }
        answerType:
          type: string
          enum: [free_text, number, multiple_choice, name_pick]
        numberUnit: { type: ["string", "null"] }
        numberMinimum: { type: ["number", "null"] }
        numberMaximum: { type: ["number", "null"] }
        displayOrder: { type: integer }
        options:
          type: array
          items: { $ref: "#/components/schemas/GuestOption" }
    GuestTiming:
      type: object
      required: [id, label, revealDate]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        revealDate: { type: string, format: date }
    GuestVault:
      type: object
      required: [name, subjectValues, layout, questions, timings, referrerCode]
      properties:
        name: { type: string }
        subjectValues:
          type: object
          additionalProperties: { type: string }
        layout:
          type: string
          enum: [one_at_a_time, all_prompts]
        questions:
          type: array
          items: { $ref: "#/components/schemas/GuestQuestion" }
        timings:
          type: array
          items: { $ref: "#/components/schemas/GuestTiming" }
        referrerCode: { type: string }
    GuestAnswerInput:
      type: object
      required: [vaultQuestionId, revealSlotId, answerType]
      properties:
        vaultQuestionId: { type: string, format: uuid }
        revealSlotId: { type: string, format: uuid }
        answerType:
          type: string
          enum: [free_text, number, multiple_choice, name_pick]
        textValue: { type: ["string", "null"], maxLength: 140 }
        numberValue: { type: ["number", "null"] }
        optionId: { type: ["string", "null"], format: uuid }
    GuestSubmissionInput:
      type: object
      required: [displayName, emailOptedOut, answers]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        email: { type: ["string", "null"], format: email }
        emailOptedOut: { type: boolean }
        website: { type: string, maxLength: 200 }
        answers:
          type: array
          minItems: 1
          maxItems: 300
          items: { $ref: "#/components/schemas/GuestAnswerInput" }
    GuestSubmissionConfirmation:
      type: object
      required: [accepted, createVaultUrl]
      properties:
        accepted: { type: boolean }
        createVaultUrl: { type: string }
    AnswerValue:
      type: object
      required: [answerId, guestId, guestDisplayName, textValue, numberValue, optionId]
      properties:
        answerId: { type: string, format: uuid }
        guestId: { type: string, format: uuid }
        guestDisplayName: { type: string }
        textValue: { type: ["string", "null"] }
        numberValue: { type: ["number", "null"] }
        optionId: { type: ["string", "null"], format: uuid }
    TextCluster:
      type: object
      required: [key, normalizedValue, answerCount, answers, suggestedTier]
      properties:
        key: { type: string }
        normalizedValue: { type: string }
        answerCount: { type: integer }
        suggestedTier: { type: ["string", "null"], enum: [full, half, zero, null] }
        confirmedTier: { type: ["string", "null"], enum: [full, half, zero, null] }
        answers:
          type: array
          items: { $ref: "#/components/schemas/AnswerValue" }
    RevealQuestionWork:
      type: object
      required: [vaultQuestionId, revealSlotId, prompt, answerType, freeTextMode, answers, clusters]
      properties:
        vaultQuestionId: { type: string, format: uuid }
        revealSlotId: { type: string, format: uuid }
        prompt: { type: string }
        answerType: { type: string, enum: [free_text, number, multiple_choice, name_pick] }
        freeTextMode: { type: ["string", "null"], enum: [scoreable, keepsake, null] }
        numberCloseBand: { type: ["number", "null"] }
        trueTextValue: { type: ["string", "null"] }
        trueNumberValue: { type: ["number", "null"] }
        trueOptionId: { type: ["string", "null"], format: uuid }
        operatorNote: { type: ["string", "null"], maxLength: 140 }
        answers: { type: array, items: { $ref: "#/components/schemas/AnswerValue" } }
        clusters: { type: array, items: { $ref: "#/components/schemas/TextCluster" } }
    UnlockedRevealWork:
      type: object
      required: [questions]
      properties:
        questions: { type: array, items: { $ref: "#/components/schemas/RevealQuestionWork" } }
    OutcomeInput:
      type: object
      properties:
        trueTextValue: { type: ["string", "null"], maxLength: 140 }
        trueNumberValue: { type: ["number", "null"] }
        trueOptionId: { type: ["string", "null"], format: uuid }
        operatorNote: { type: ["string", "null"], maxLength: 140 }
    ResolvedOutcome:
      type: object
      required: [outcomeId, vaultQuestionId, revealSlotId, verdictCount]
      properties:
        outcomeId: { type: string, format: uuid }
        vaultQuestionId: { type: string, format: uuid }
        revealSlotId: { type: string, format: uuid }
        verdictCount: { type: integer }
    ClusterVerdictInput:
      type: object
      required: [tier]
      properties:
        tier: { type: string, enum: [full, half, zero] }
    ClusterVerdictResult:
      type: object
      required: [clusterKey, tier, affectedAnswers]
      properties:
        clusterKey: { type: string }
        tier: { type: string, enum: [full, half, zero] }
        affectedAnswers: { type: integer }
    ScoreboardEntry:
      type: object
      required: [guestId, displayName, full, half, zero, total]
      properties:
        guestId: { type: string, format: uuid }
        displayName: { type: string }
        full: { type: integer }
        half: { type: integer }
        zero: { type: integer }
        total: { type: number }
    Scoreboard:
      type: object
      required: [entries]
      properties:
        entries: { type: array, items: { $ref: "#/components/schemas/ScoreboardEntry" } }
    OutcomeCounts:
      type: object
      required: [full, half, zero, scored]
      properties:
        full: { type: integer }
        half: { type: integer }
        zero: { type: integer }
        scored: { type: integer }
    VaultHealthReport:
      type: object
      required: [vaultId, planTier, status, predictionCount, guestCount, revealSlots, completedRevealCount, nextRevealDate]
      properties:
        vaultId: { type: string, format: uuid }
        planTier: { type: string, enum: [lockbox, safe, vault, deep_vault] }
        status: { type: string }
        predictionCount: { type: integer }
        guestCount: { type: integer }
        revealSlots: { type: array, items: { $ref: "#/components/schemas/GuestTiming" } }
        completedRevealCount: { type: integer }
        nextRevealDate: { type: ["string", "null"], format: date }
    ReportAnswer:
      allOf:
        - $ref: "#/components/schemas/AnswerValue"
        - type: object
          required: [revealSlotId, outcomeTier, optionLabel]
          properties:
            revealSlotId: { type: string, format: uuid }
            outcomeTier: { type: ["string", "null"], enum: [full, half, zero, null] }
            optionLabel: { type: ["string", "null"] }
    QuestionReport:
      type: object
      required: [vaultQuestionId, prompt, answerType, freeTextMode, answers, options, optionCounts, outcomes]
      properties:
        vaultQuestionId: { type: string, format: uuid }
        prompt: { type: string }
        answerType: { type: string }
        freeTextMode: { type: ["string", "null"], enum: [scoreable, keepsake, null] }
        answers: { type: array, items: { $ref: "#/components/schemas/ReportAnswer" } }
        options: { type: array, items: { type: object, required: [id, label], properties: { id: { type: string, format: uuid }, label: { type: string } } } }
        optionCounts: { type: array, items: { type: object, required: [optionId, label, count], properties: { optionId: { type: string, format: uuid }, label: { type: string }, count: { type: integer } } } }
        outcomes: { type: array, items: { type: object, required: [revealSlotId, operatorNote], properties: { revealSlotId: { type: string, format: uuid }, trueTextValue: { type: ["string", "null"] }, trueNumberValue: { type: ["number", "null"] }, trueOptionId: { type: ["string", "null"], format: uuid }, trueOptionLabel: { type: ["string", "null"] }, operatorNote: { type: ["string", "null"] } } } }
    RevealReport:
      type: object
      required: [revealSlotId, label, revealDate, questions]
      properties:
        revealSlotId: { type: string, format: uuid }
        label: { type: string }
        revealDate: { type: string, format: date }
        questions: { type: array, items: { $ref: "#/components/schemas/QuestionReport" } }
    GuestPersonalReport:
      type: object
      required: [guestId, displayName, rank, score, answers]
      properties:
        guestId: { type: string, format: uuid }
        displayName: { type: string }
        rank: { type: ["integer", "null"] }
        score: { $ref: "#/components/schemas/OutcomeCounts" }
        answers:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/ReportAnswer"
              - type: object
                required: [prompt, operatorNote, freeTextMode]
                properties:
                  prompt: { type: string }
                  operatorNote: { type: ["string", "null"] }
                  freeTextMode: { type: ["string", "null"], enum: [scoreable, keepsake, null] }
    AreaReport:
      type: object
      required: [areas]
      properties:
        areas: { type: array, items: { type: object, required: [id, name, iconKey, outcomes], properties: { id: { type: string, format: uuid }, name: { type: string }, iconKey: { type: string }, outcomes: { $ref: "#/components/schemas/OutcomeCounts" } } } }
    TimelineReport:
      type: object
      required: [reveals]
      properties:
        reveals: { type: array, items: { type: object, required: [revealSlotId, label, revealDate, outcomes], properties: { revealSlotId: { type: string, format: uuid }, label: { type: string }, revealDate: { type: string, format: date }, outcomes: { $ref: "#/components/schemas/OutcomeCounts" } } } }
    AnswersArchive:
      type: object
      required: [questions]
      properties: { questions: { type: array, items: { $ref: "#/components/schemas/QuestionReport" } } }
    VaultResultsSummary:
      type: object
      required: [vaultId, planTier, depth, vault, outcomes, questions, standouts]
      properties:
        vaultId: { type: string, format: uuid }
        planTier: { type: string, enum: [lockbox, safe, vault, deep_vault] }
        depth: { type: string, enum: [trimmed, full] }
        vault:
          type: object
          required: [name, subjectValues, status, sealedAt]
          properties:
            name: { type: string }
            subjectValues: { type: object, additionalProperties: { type: string } }
            status: { type: string }
            sealedAt: { type: ["string", "null"], format: date-time }
        outcomes: { $ref: "#/components/schemas/OutcomeCounts" }
        questions:
          type: array
          items:
            type: object
            required: [vaultQuestionId, prompt, answerType, freeTextMode, outcomes]
            properties:
              vaultQuestionId: { type: string, format: uuid }
              prompt: { type: string }
              answerType: { type: string }
              freeTextMode: { type: ["string", "null"], enum: [scoreable, keepsake, null] }
              outcomes: { type: array, items: { type: object, required: [revealSlotId, operatorNote], properties: { revealSlotId: { type: string, format: uuid }, operatorNote: { type: ["string", "null"] } } } }
        standouts:
          type: array
          items:
            type: object
            required: [vaultQuestionId, prompt, outcomeTier, operatorNote]
            properties:
              vaultQuestionId: { type: string, format: uuid }
              prompt: { type: string }
              outcomeTier: { type: string, enum: [full, half, zero] }
              operatorNote: { type: ["string", "null"] }
        areas: { type: array, items: { type: object } }
        timeline: { type: array, items: { type: object } }
        scoreboard: { type: array, items: { $ref: "#/components/schemas/ScoreboardEntry" } }
    FinaleReport:
      allOf:
        - $ref: "#/components/schemas/AnswersArchive"
        - type: object
          required: [vaultId, planTier, outcomeCounts, certificate, scoreboard, winner, areas, timeline, standouts, guestCount, predictionCount, completionReady]
          properties:
            vaultId: { type: string, format: uuid }
            planTier: { type: string, enum: [safe, vault, deep_vault] }
            outcomeCounts: { $ref: "#/components/schemas/OutcomeCounts" }
            certificate: { type: boolean }
            scoreboard: { type: array, items: { $ref: "#/components/schemas/ScoreboardEntry" } }
            winner: { anyOf: [{ $ref: "#/components/schemas/ScoreboardEntry" }, { type: "null" }] }
            areas: { $ref: "#/components/schemas/AreaReport" }
            timeline: { $ref: "#/components/schemas/TimelineReport" }
            standouts:
              type: array
              items:
                type: object
                required: [vaultQuestionId, prompt, outcomeTier, operatorNote]
                properties:
                  vaultQuestionId: { type: string, format: uuid }
                  prompt: { type: string }
                  outcomeTier: { type: string, enum: [full, half, zero] }
                  operatorNote: { type: ["string", "null"] }
            guestCount: { type: integer }
            predictionCount: { type: integer }
            completionReady: { type: boolean }

