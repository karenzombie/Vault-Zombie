      operationId: getPrintArchive
      tags: [operator]
      summary: Get paid printable archive DTO
      parameters: [{ $ref: "#/components/parameters/VaultId" }]
      responses: { "200": { description: Print archive, content: { application/json: { schema: { $ref: "#/components/schemas/FinaleReport" } } } }, "401": { description: Authentication required }, "403": { description: Paid plan and ownership required }, "404": { description: Vault not found } }
components:
  parameters:
    VaultId:
      name: vaultId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RevealSlotId:
      name: revealSlotId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VaultQuestionId:
      name: vaultQuestionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GuestToken:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 32, maxLength: 256 }
    GuestId:
      name: guestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GiftCode:
      name: code
      in: path
      required: true
      schema: { type: string, minLength: 12, maxLength: 64 }
    BillingRecordId:
      name: billingRecordId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GiftId:
      name: giftId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CheckoutSessionId:
      name: checkoutSessionId
      in: path
      required: true
      schema: { type: string, minLength: 8, maxLength: 255, pattern: "^cs_" }
    ContentKind:
      name: kind
      in: path
      required: true
      schema: { type: string, enum: [vault-types, subcategories, questions, options] }
    ContentId:
      name: contentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContentRetirementState:
      name: state
      in: path
      required: true
      schema: { type: string, enum: [retire, reactivate] }
  schemas:
    LegalConfiguration:
      type: object
      required: [termsVersion, privacyVersion, termsUrl, privacyUrl]
      properties:
        termsVersion: { type: string }
        privacyVersion: { type: string }
        termsUrl: { type: string, const: /terms }
        privacyUrl: { type: string, const: /privacy }
    LegalStatus:
      allOf:
        - $ref: "#/components/schemas/LegalConfiguration"
        - type: object
          required: [accepted, acceptedAt]
          properties:
            accepted: { type: boolean }
            acceptedAt: { type: ["string", "null"], format: date-time }
    LegalConsentInput:
      type: object
      required: [accepted, termsVersion, privacyVersion]
      properties:
        accepted: { type: boolean, const: true }
        termsVersion: { type: string, minLength: 1 }
        privacyVersion: { type: string, minLength: 1 }
    LegalSignupIntentInput:
      type: object
      required: [accepted, termsVersion, privacyVersion]
      properties:
        accepted: { type: boolean, const: true }
        termsVersion: { type: string, minLength: 1 }
        privacyVersion: { type: string, minLength: 1 }
    LegalSignupIntent:
      allOf:
        - $ref: "#/components/schemas/LegalConfiguration"
        - type: object
          required: [token, expiresAt]
          properties:
            token: { type: string }
            expiresAt: { type: string, format: date-time }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    VaultCheckoutInput:
      type: object
      required: [targetTier]
      properties:
        targetTier: { type: string, enum: [safe, vault, deep_vault] }
    GiftCheckoutInput:
      type: object
      required: [targetTier]
      properties:
        targetTier: { type: string, enum: [safe, vault, deep_vault] }
        fromLine: { type: string, maxLength: 80 }
        toLine: { type: string, maxLength: 80 }
        gifterEmail: { type: string, format: email }
        recipientEmail: { type: string, format: email }
    BillingPrice:
      type: object
      required: [fromTier, targetTier, amountCents, currency]
      properties:
        fromTier: { type: string, enum: [lockbox, safe, vault] }
        targetTier: { type: string, enum: [safe, vault, deep_vault] }
        amountCents: { type: integer, minimum: 1 }
        currency: { type: string, enum: [usd] }
    GiftCheckoutSession:
      type: object
      required: [giftId, checkoutUrl, status]
      properties:
        giftId: { type: string, format: uuid }
        checkoutUrl: { type: string, format: uri }
        status: { type: string, enum: [pending] }
    GiftCard:
      type: object
      required: [logo, line, tierName, code, redemptionUrl, description]
      properties:
        logo: { type: string }
        line: { type: string }
        tierName: { type: string }
        code: { type: string }
        redemptionUrl: { type: string, format: uri }
        fromLine: { type: ["string", "null"] }
        toLine: { type: ["string", "null"] }
        description: { type: string }
    RedeemGiftInput:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 12, maxLength: 64 }
    RedeemGiftResult:
      type: object
      required: [billingRecordId, tier]
      properties:
        billingRecordId: { type: string, format: uuid }
        tier: { type: string, enum: [safe, vault, deep_vault] }
    EntitlementStartInput:
      type: object
      required: [targetTier]
      properties:
        targetTier: { type: string, enum: [lockbox, safe, vault, deep_vault] }
    EntitlementStart:
      type: object
      required: [status, billingRecordId, targetTier]
      properties:
        status: { type: string, enum: [ready, checkout] }
        billingRecordId: { type: string, format: uuid }
        targetTier: { type: string, enum: [lockbox, safe, vault, deep_vault] }
        checkoutUrl: { type: ["string", "null"], format: uri }
    EntitlementStatus:
      type: object
      required: [billingRecordId, targetTier, status]
      properties:
        billingRecordId: { type: string, format: uuid }
        targetTier: { type: string, enum: [lockbox, safe, vault, deep_vault] }
        status: { type: string, enum: [pending, paid, failed, expired, disputed, refunded, comped] }
    CreateDraftVaultInput:
      type: object
      required: [billingRecordId, vaultTypeId, name]
      properties:
        billingRecordId: { type: string, format: uuid }
        vaultTypeId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        subjectValues: { type: object, additionalProperties: { type: string } }
    CreateDraftVaultResult:
      type: object
      required: [vaultId]
      properties:
        vaultId: { type: string, format: uuid }
    OperatorVaultType:
      type: object
      required: [id, slug, name, requiredSubjectTokens]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        requiredSubjectTokens: { type: array, items: { type: string } }
    VaultSetupDetail:
      type: object
      required: [id, name, status, planTier, entitledPlanTier, vaultTypeId, vaultTypeName, vaultTypeSlug, revealSchedule, anchorDate, milestoneDate, milestoneLabel, coverObjectKey, guestLayout, guestToken]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [draft, sealed, active, completed] }
        planTier: { type: string, enum: [lockbox, safe, vault, deep_vault] }
        entitledPlanTier: { type: string, enum: [lockbox, safe, vault, deep_vault] }
        vaultTypeId: { type: string, format: uuid }
        vaultTypeName: { type: string }
        vaultTypeSlug: { type: string }
        revealSchedule: { type: ["string", "null"], enum: [weekly_sprint, monthly_x3, monthly_year, half_then_annual, annual_keepsake, null] }
        anchorDate: { type: ["string", "null"], format: date }
        milestoneDate: { type: ["string", "null"], format: date }
        milestoneLabel: { type: ["string", "null"], maxLength: 60 }
        coverObjectKey: { type: ["string", "null"] }
        guestLayout: { type: string, enum: [one_at_a_time, all_prompts] }
        guestToken:
          type: string
          description: >-
            The raw guest link token. Only ever returned to this vault's own
            authenticated host on this read; never exposed to a guest or an
            unauthenticated request.
    SealReadiness:
      type: object
      required: [ready, reasons, promptCount, scheduleName, tierName, firstRevealDate, lastRevealDate]
      properties:
        ready: { type: boolean }
        reasons: { type: array, items: { type: string } }
        promptCount: { type: integer }
        scheduleName: { type: ["string", "null"], enum: [weekly_sprint, monthly_x3, monthly_year, half_then_annual, annual_keepsake, null] }
        tierName: { type: string, enum: [lockbox, safe, vault, deep_vault] }
        firstRevealDate: { type: ["string", "null"], format: date }
        lastRevealDate: { type: ["string", "null"], format: date }
    SealVaultResult:
      type: object
      required: [vaultId, guestToken, sealedAt]
      properties:
        vaultId: { type: string, format: uuid }
        guestToken: { type: string }
        sealedAt: { type: string, format: date-time }
    UpdateVaultSetupInput:
      type: object
      required: [planTier]
      properties:
        planTier: { type: string, enum: [lockbox, safe, vault, deep_vault] }
        revealSchedule: { type: ["string", "null"], enum: [weekly_sprint, monthly_x3, monthly_year, half_then_annual, annual_keepsake, null] }
        anchorDate: { type: ["string", "null"], format: date }
        milestoneDate: { type: ["string", "null"], format: date }
        milestoneLabel: { type: ["string", "null"], maxLength: 60 }
    RevealSlotPreview:
      type: object
      required: [kind, label, revealDate]
      properties:
        kind: { type: string, enum: [scheduled, milestone] }
        label: { type: string }
        revealDate: { type: string, format: date }
    SchedulePreviewInput:
      type: object
      required: [planTier, schedule]
      properties:
        anchorDate: { type: ["string", "null"], format: date }
        planTier: { type: string, enum: [lockbox, safe, vault, deep_vault] }
        schedule: { type: string, enum: [weekly_sprint, monthly_x3, monthly_year, half_then_annual, annual_keepsake] }
        milestoneDate: { type: ["string", "null"], format: date }
        milestoneLabel: { type: ["string", "null"], maxLength: 60 }
    SchedulePreviewResult:
      type: object
      required: [revealSlots]
      properties:
        revealSlots: { type: array, items: { $ref: "#/components/schemas/RevealSlotPreview" } }
    VaultPrompt:
      type: object
      required: [id, prompt, enabled, displayOrder, isCustom, answerType, freeTextMode, subcategoryId, subcategoryName, subcategoryDisplayOrder]
      properties:
        id: { type: string, format: uuid }
        prompt: { type: string, maxLength: 140 }
        enabled: { type: boolean }
        displayOrder: { type: integer }
        isCustom: { type: boolean }
        answerType: { type: string, enum: [free_text, number, multiple_choice, name_pick] }
        freeTextMode: { type: ["string", "null"], enum: [scoreable, keepsake, null] }
        subcategoryId: { type: ["string", "null"], format: uuid }
        subcategoryName: { type: ["string", "null"] }
        subcategoryDisplayOrder: { type: ["integer", "null"] }
    VaultPromptList:
      type: object
      required: [prompts]
      properties:
        prompts: { type: array, items: { $ref: "#/components/schemas/VaultPrompt" } }
    AddCustomPromptInput:
      type: object
      required: [prompt, freeTextMode]
      properties:
        prompt: { type: string, minLength: 1, maxLength: 140 }
        freeTextMode: { type: string, enum: [scoreable, keepsake] }
    TogglePromptInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    ReorderPromptsInput:
      type: object
      required: [orderedVaultQuestionIds]
      properties:
        orderedVaultQuestionIds: { type: array, items: { type: string, format: uuid }, minItems: 1 }
    VaultCoverInfo:
      type: object
      required: [coverObjectKey]
      properties:
        coverObjectKey: { type: ["string", "null"], description: "Object storage path for the uploaded cover photo, or null to use the vault type's silhouette." }
    GuestLayoutInput:
      type: object
      required: [guestLayout]
      properties:
        guestLayout: { type: string, enum: [one_at_a_time, all_prompts] }
    GuestLayoutInfo:
      type: object
      required: [guestLayout]
      properties:
        guestLayout: { type: string, enum: [one_at_a_time, all_prompts] }
    SealedVaultDateInfo:
      type: object
      required: [anchorDate, revealSchedule, locked]
      properties:
        anchorDate: { type: ["string", "null"], format: date }
        revealSchedule: { type: ["string", "null"], enum: [weekly_sprint, monthly_x3, monthly_year, half_then_annual, annual_keepsake, null] }
        locked: { type: boolean, description: "True once any reveal has opened; the date can no longer change." }
    SealedVaultDateChangeInput:
      type: object
      required: [newAnchorDate]
      properties:
        newAnchorDate: { type: string, format: date }
    SealedVaultDateChangeResult:
      type: object
      required: [anchorDate, revealSlots]
      properties:
        anchorDate: { type: string, format: date }
        revealSlots: { type: array, items: { $ref: "#/components/schemas/RevealSlotPreview" } }
    OverageStatus:
      type: object
      required: [vaultId, heldSubmissionCount, unresolved, nearestRevealDate]
      properties:
        vaultId: { type: string, format: uuid }
        heldSubmissionCount: { type: integer }
        unresolved: { type: boolean }
        nearestRevealDate: { type: ["string", "null"], format: date }
    OverageDeclineResult:
      type: object
      required: [archivedSubmissionCount]
      properties: { archivedSubmissionCount: { type: integer } }
    SensitiveReasonInput:
      type: object
      required: [reason]
      properties: { reason: { type: string, minLength: 1, maxLength: 1000 } }
    RefundRequestInput:
      allOf:
        - $ref: "#/components/schemas/SensitiveReasonInput"
        - type: object
          required: [requestId]
          properties:
            requestId: { type: string, format: uuid, description: Stable client action ID retained for uncertain retry reconciliation. }
    ContentItem:
      type: object
      additionalProperties: true
      description: A vault type, subcategory, question, or option with its permanent ID.
    ContentMutationInput:
      allOf:
        - $ref: "#/components/schemas/SensitiveReasonInput"
        - $ref: "#/components/schemas/ContentItem"
    ContentReorderInput:
      allOf:
        - $ref: "#/components/schemas/SensitiveReasonInput"
        - type: object
          required: [ids]
          properties:
            ids:
              type: array
              minItems: 1
              uniqueItems: true
              items: { type: string, format: uuid }
    ContentReorderResult:
      type: object
      required: [ids]
      properties:
        ids: { type: array, items: { type: string, format: uuid } }
    AdminContentList:
      type: object
      required: [vaultTypes, subcategories, questions, options]
      properties:
        vaultTypes: { type: array, items: { $ref: "#/components/schemas/ContentItem" } }
        subcategories: { type: array, items: { $ref: "#/components/schemas/ContentItem" } }
        questions: { type: array, items: { $ref: "#/components/schemas/ContentItem" } }
        options: { type: array, items: { $ref: "#/components/schemas/ContentItem" } }
    ContentImportRequest:
      type: object
      required: [bank]
      properties:
        bank: { $ref: "#/components/schemas/QuestionBankImport" }
    ContentImportApplyRequest:
      allOf:
        - $ref: "#/components/schemas/ContentImportRequest"
        - $ref: "#/components/schemas/SensitiveReasonInput"
    ContentImportPreview:
      type: object
      required: [unresolvedCount, issues, canApply]
      properties:
        unresolvedCount: { type: integer, minimum: 0 }
        canApply: { type: boolean }
        issues:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
    ContentImportResult:
      type: object
      required: [vaultTypeId, subcategoryCount, questionCount, optionCount]
      properties:
        vaultTypeId: { type: string, format: uuid }
        subcategoryCount: { type: integer }
        questionCount: { type: integer }
        optionCount: { type: integer }
    QuestionBankImport:
      type: object
      required: [vaultType, subcategories]
      properties:
        vaultType:
          type: object
          required: [slug, name, requiredSubjectTokens, displayOrder]
          properties:
            slug: { type: string, minLength: 1 }
            name: { type: string, minLength: 1 }
            requiredSubjectTokens: { type: array, items: { type: string, minLength: 1 } }
            displayOrder: { type: integer }
        subcategories:
          type: array
          minItems: 1
          items:
            type: object
            required: [sourceKey, name, displayOrder, questions]
            properties:
              sourceKey: { type: string, minLength: 1 }
              name: { type: string, minLength: 1 }
              iconKey: { type: string }
              displayOrder: { type: integer }
              questions:
                type: array
                items:
                  type: object
                  required: [sourceKey, prompt, answerType, displayOrder, options]
                  properties:
                    sourceKey: { type: string, minLength: 1 }
                    prompt: { type: string, minLength: 1 }
                    answerType: { type: string, enum: [free_text, number, multiple_choice, name_pick] }
                    freeTextMode: { type: string, enum: [scoreable, keepsake] }
                    number:
                      type: object
                      required: [unit, minimum, maximum, closeBand]
                      properties:
                        unit: { type: string, minLength: 1 }
                        minimum: { type: number }
                        maximum: { type: number }
                        closeBand: { type: number, minimum: 0 }
                    fitTag: { type: string, enum: [short, long] }
                    displayOrder: { type: integer }
                    options: { type: array, items: { type: string, minLength: 1 } }
    AdminDashboard:
      type: object
      required: [operatorCount, vaultCount, guestCount, submissionCount, vaultsByState, vaultsByType, vaultsByTier, revealProgress, guestMetrics, unresolvedOverageCount, failedEmailCount]
      properties:
        operatorCount: { type: integer }
        vaultCount: { type: integer }
        guestCount: { type: integer }
        submissionCount: { type: integer }
        vaultsByState: { type: array, items: { $ref: "#/components/schemas/AdminCountBucket" } }
        vaultsByType: { type: array, items: { $ref: "#/components/schemas/AdminCountBucket" } }
        vaultsByTier: { type: array, items: { $ref: "#/components/schemas/AdminCountBucket" } }
        revealProgress:
          type: object
          required: [slotsTotal, slotsLanded, answersTotal, answersUnlocked]
          properties:
            slotsTotal: { type: integer }
            slotsLanded: { type: integer }
            answersTotal: { type: integer }
            answersUnlocked: { type: integer }
        guestMetrics:
          type: object
          required: [averageGuestsPerVault, capExceededEventCount]
          properties:
            averageGuestsPerVault: { type: number }
            capExceededEventCount: { type: integer }
        unresolvedOverageCount: { type: integer }
        failedEmailCount: { type: integer }
    AdminCountBucket:
      type: object
      required: [key, count]
      properties:
        key: { type: string }
        count: { type: integer }
    AdminRevenueReport:
      type: object
      required: [from, to, filters, grossConfirmedAmountCents, refundedAmountCents, disputedAmountCents, compAmountCents, giftIssuedAmountCents, giftRedeemedAmountCents, recordCount, reconciliation]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        filters: { type: object, additionalProperties: true }
        grossConfirmedAmountCents: { type: integer }
        refundedAmountCents: { type: integer }
        disputedAmountCents: { type: integer }
        compAmountCents: { type: integer }
        giftIssuedAmountCents: { type: integer }
        giftRedeemedAmountCents: { type: integer }
        recordCount: { type: integer }
        reconciliation:
          type: object
          required: [feesAvailable, netAvailable, payoutsAvailable, message]
          properties:
            feesAvailable: { type: boolean }
            netAvailable: { type: boolean }
            payoutsAvailable: { type: boolean }
            message: { type: string }
    AdminOperatorList:
      type: object
      required: [operators, total, limit, offset]
      properties:
        operators:
          type: array
          items:
            type: object
            required: [id, displayName, email, status, createdAt, vaultCount]
            properties:
              id: { type: string, format: uuid }
              displayName: { type: string }
              email: { type: string, format: email }
              status: { type: string }
              createdAt: { type: string, format: date-time }
              vaultCount: { type: integer }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    AdminOperatorDetail:
      type: object
      required: [operator, vaults, billingRecords, totalBillingRecords, limit, offset]
      properties:
        operator: { $ref: "#/components/schemas/AdminOperatorList/properties/operators/items" }
        vaults: { type: array, items: { $ref: "#/components/schemas/AdminVaultList/properties/vaults/items" } }
        billingRecords: { type: array, items: { $ref: "#/components/schemas/AdminBillingList/properties/records/items" } }
        totalBillingRecords: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    AdminGiftDetail:
      type: object
      required: [gift, deliveries]
      properties:
        gift: { $ref: "#/components/schemas/AdminGiftList/properties/gifts/items" }
        deliveries: { type: array, items: { $ref: "#/components/schemas/AdminEmailDeliveryList/properties/deliveries/items" } }
    AdminEmailDeliveryDetail:
      type: object
      required: [delivery]
      properties:
        delivery: { $ref: "#/components/schemas/AdminEmailDeliveryList/properties/deliveries/items" }
    AdminGuestList:
      type: object
      required: [guests]
      properties:
        guests:
          type: array
          items:
            type: object
            required: [id, displayName, hasEmail, emailOptedOut]
            properties:
              id: { type: string, format: uuid }
              displayName: { type: string }
              hasEmail: { type: boolean }
              emailOptedOut: { type: boolean }
    GuestEmailSubscriptionInput:
      type: object
      required: [subscribed]
      properties:
        subscribed: { type: boolean }
    GuestEmailSubscriptionResult:
      type: object
      required: [id, emailOptedOut]
      properties:
        id: { type: string, format: uuid }
        emailOptedOut: { type: boolean }
    AdminVaultSupportDetail:
      type: object
      required: [vault, billingRecords, overageEvents, emailDeliveries]
      properties:
        vault: { $ref: "#/components/schemas/AdminVaultDetail" }
        billingRecords: { type: array, items: { $ref: "#/components/schemas/AdminBillingList/properties/records/items" } }
        overageEvents: { type: array, items: { $ref: "#/components/schemas/AdminOverageList/properties/events/items" } }
        emailDeliveries: { type: array, items: { $ref: "#/components/schemas/AdminEmailDeliveryList/properties/deliveries/items" } }
    OperatorVaultList:
      type: object
      required: [vaults]
      properties:
        vaults:
          type: array
          items:
            type: object
            required: [id, name, status, cardStatus, createdAt, vaultTypeName, vaultTypeSlug]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              status: { type: string, enum: [draft, sealed, active, completed] }
              cardStatus: { type: string, enum: [draft, sealed, partially_unlocked, fully_unlocked, completed], description: "Display status; active splits into partially_unlocked or fully_unlocked." }
              createdAt: { type: string, format: date-time }
              vaultTypeName: { type: string }
              vaultTypeSlug: { type: string }
    OperatorVaultDeleteResult:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [deleted] }
    AdminVaultList:
      type: object
      required: [vaults]
      properties:
        vaults:
          type: array
          items:
            type: object
            required: [id, name, status, planTier, createdAt, sealedAt, operatorName, vaultTypeName, referralCount]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              status: { type: string }
              planTier: { type: string }
              createdAt: { type: string, format: date-time }
              sealedAt: { type: [string, "null"], format: date-time }
              operatorName: { type: string }
              vaultTypeName: { type: string }
              referralCount: { type: integer, description: "Accounts whose signup carried this vault's referrer code." }
    AdminVaultDetail:
      type: object
      required: [vault, totals, unlockedAnswerCount, revealSlots, scopePreviews, referralCount]
      properties:
        vault: { $ref: "#/components/schemas/AdminVaultList/properties/vaults/items" }
        referralCount: { type: integer }
        totals:
          type: object
