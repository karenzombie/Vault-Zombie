openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: guest
    description: Account-free, write-only guest prediction flow
  - name: operator
    description: Authenticated operator reveal and scoring operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /guest/{token}:
    get:
      operationId: getGuestVault
      tags: [guest]
      summary: Load the sealed prompt form
      parameters:
        - $ref: "#/components/parameters/GuestToken"
      responses:
        "200":
          description: Public form metadata only; never prediction content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestVault"
        "404":
          description: Link not found
  /guest/{token}/submissions:
    post:
      operationId: submitGuestPrediction
      tags: [guest]
      summary: Atomically seal one guest submission
      parameters:
        - $ref: "#/components/parameters/GuestToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestSubmissionInput"
      responses:
        "201":
          description: Submission sealed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestSubmissionConfirmation"
        "400":
          description: Invalid submission
        "404":
          description: Link not found
        "429":
          description: Rate limit reached
  /operator/vaults/{vaultId}/reveals/unlocked:
    get:
      operationId: listUnlockedRevealWork
      tags: [operator]
      summary: List unlocked reveal work for an owned vault
      parameters:
        - $ref: "#/components/parameters/VaultId"
      responses:
        "200":
          description: Unlocked answers grouped into question work items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlockedRevealWork"
        "401": { description: Authentication required }
        "403": { description: Vault is not owned by this operator }
        "404": { description: Vault not found }
  /operator/vaults/{vaultId}/reveals/{revealSlotId}/questions/{vaultQuestionId}/outcome:
    put:
      operationId: resolveRevealQuestionOutcome
      tags: [operator]
      summary: Atomically save a question outcome and automatic verdicts
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - $ref: "#/components/parameters/RevealSlotId"
        - $ref: "#/components/parameters/VaultQuestionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutcomeInput" }
      responses:
        "200":
          description: Outcome resolved idempotently
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedOutcome" }
        "400": { description: Invalid outcome for question type }
        "401": { description: Authentication required }
        "403": { description: Vault is not owned by this operator }
        "404": { description: Unlocked reveal question not found }
  /operator/vaults/{vaultId}/reveals/{revealSlotId}/questions/{vaultQuestionId}/clusters/{clusterKey}/verdict:
    put:
      operationId: overrideRevealTextClusterVerdict
      tags: [operator]
      summary: Confirm or override one free-text answer cluster
      parameters:
        - $ref: "#/components/parameters/VaultId"
        - $ref: "#/components/parameters/RevealSlotId"
        - $ref: "#/components/parameters/VaultQuestionId"
        - name: clusterKey
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 140 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClusterVerdictInput" }
      responses:
        "200":
          description: Cluster verdict saved idempotently
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterVerdictResult" }
        "400": { description: Cluster is not scoreable }
        "401": { description: Authentication required }
        "403": { description: Vault is not owned by this operator }
        "404": { description: Unlocked cluster or resolved outcome not found }
  /operator/vaults/{vaultId}/scoreboard:
    get:
      operationId: getOperatorScoreboard
      tags: [operator]
      summary: Get the scored unlocked-answer scoreboard for an owned vault
      parameters:
        - $ref: "#/components/parameters/VaultId"
      responses:
        "200":
          description: Scoreboard totals, with full worth one and half worth one half
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scoreboard" }
        "401": { description: Authentication required }
        "403": { description: Vault is not owned by this operator }
        "404": { description: Vault not found }
components:
  parameters:
    VaultId:
      name: vaultId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RevealSlotId:
      name: revealSlotId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VaultQuestionId:
      name: vaultQuestionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GuestToken:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 32, maxLength: 256 }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GuestOption:
      type: object
      required: [id, label]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
    GuestQuestion:
      type: object
      required: [id, prompt, answerType, displayOrder, options]
      properties:
        id: { type: string, format: uuid }
        prompt: { type: string }
        answerType:
          type: string
          enum: [free_text, number, multiple_choice, name_pick]
        numberUnit: { type: ["string", "null"] }
        numberMinimum: { type: ["number", "null"] }
        numberMaximum: { type: ["number", "null"] }
        displayOrder: { type: integer }
        options:
          type: array
          items: { $ref: "#/components/schemas/GuestOption" }
    GuestTiming:
      type: object
      required: [id, label, revealDate]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        revealDate: { type: string, format: date }
    GuestVault:
      type: object
      required: [name, subjectValues, layout, questions, timings, referrerCode]
      properties:
        name: { type: string }
        subjectValues:
          type: object
          additionalProperties: { type: string }
        layout:
          type: string
          enum: [one_at_a_time, all_prompts]
        questions:
          type: array
          items: { $ref: "#/components/schemas/GuestQuestion" }
        timings:
          type: array
          items: { $ref: "#/components/schemas/GuestTiming" }
        referrerCode: { type: string }
    GuestAnswerInput:
      type: object
      required: [vaultQuestionId, revealSlotId, answerType]
      properties:
        vaultQuestionId: { type: string, format: uuid }
        revealSlotId: { type: string, format: uuid }
        answerType:
          type: string
          enum: [free_text, number, multiple_choice, name_pick]
        textValue: { type: ["string", "null"], maxLength: 140 }
        numberValue: { type: ["number", "null"] }
        optionId: { type: ["string", "null"], format: uuid }
    GuestSubmissionInput:
      type: object
      required: [displayName, emailOptedOut, answers]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        email: { type: ["string", "null"], format: email }
        emailOptedOut: { type: boolean }
        website: { type: string, maxLength: 200 }
        answers:
          type: array
          minItems: 1
          maxItems: 300
          items: { $ref: "#/components/schemas/GuestAnswerInput" }
    GuestSubmissionConfirmation:
      type: object
      required: [accepted, createVaultUrl]
      properties:
        accepted: { type: boolean }
        createVaultUrl: { type: string }
    AnswerValue:
      type: object
      required: [answerId, guestId, guestDisplayName, textValue, numberValue, optionId]
      properties:
        answerId: { type: string, format: uuid }
        guestId: { type: string, format: uuid }
        guestDisplayName: { type: string }
        textValue: { type: ["string", "null"] }
        numberValue: { type: ["number", "null"] }
        optionId: { type: ["string", "null"], format: uuid }
    TextCluster:
      type: object
      required: [key, normalizedValue, answerCount, answers, suggestedTier]
      properties:
        key: { type: string }
        normalizedValue: { type: string }
        answerCount: { type: integer }
        suggestedTier: { type: ["string", "null"], enum: [full, half, zero, null] }
        confirmedTier: { type: ["string", "null"], enum: [full, half, zero, null] }
        answers:
          type: array
          items: { $ref: "#/components/schemas/AnswerValue" }
    RevealQuestionWork:
      type: object
      required: [vaultQuestionId, revealSlotId, prompt, answerType, freeTextMode, answers, clusters]
      properties:
        vaultQuestionId: { type: string, format: uuid }
        revealSlotId: { type: string, format: uuid }
        prompt: { type: string }
        answerType: { type: string, enum: [free_text, number, multiple_choice, name_pick] }
        freeTextMode: { type: ["string", "null"], enum: [scoreable, keepsake, null] }
        numberCloseBand: { type: ["number", "null"] }
        trueTextValue: { type: ["string", "null"] }
        trueNumberValue: { type: ["number", "null"] }
        trueOptionId: { type: ["string", "null"], format: uuid }
        operatorNote: { type: ["string", "null"], maxLength: 140 }
        answers: { type: array, items: { $ref: "#/components/schemas/AnswerValue" } }
        clusters: { type: array, items: { $ref: "#/components/schemas/TextCluster" } }
    UnlockedRevealWork:
      type: object
      required: [questions]
      properties:
        questions: { type: array, items: { $ref: "#/components/schemas/RevealQuestionWork" } }
    OutcomeInput:
      type: object
      properties:
        trueTextValue: { type: ["string", "null"], maxLength: 140 }
        trueNumberValue: { type: ["number", "null"] }
        trueOptionId: { type: ["string", "null"], format: uuid }
        operatorNote: { type: ["string", "null"], maxLength: 140 }
    ResolvedOutcome:
      type: object
      required: [outcomeId, vaultQuestionId, revealSlotId, verdictCount]
      properties:
        outcomeId: { type: string, format: uuid }
        vaultQuestionId: { type: string, format: uuid }
        revealSlotId: { type: string, format: uuid }
        verdictCount: { type: integer }
    ClusterVerdictInput:
      type: object
      required: [tier]
      properties:
        tier: { type: string, enum: [full, half, zero] }
    ClusterVerdictResult:
      type: object
      required: [clusterKey, tier, affectedAnswers]
      properties:
        clusterKey: { type: string }
        tier: { type: string, enum: [full, half, zero] }
        affectedAnswers: { type: integer }
    ScoreboardEntry:
      type: object
      required: [guestId, displayName, full, half, zero, total]
      properties:
        guestId: { type: string, format: uuid }
        displayName: { type: string }
        full: { type: integer }
        half: { type: integer }
        zero: { type: integer }
        total: { type: number }
    Scoreboard:
      type: object
      required: [entries]
      properties:
        entries: { type: array, items: { $ref: "#/components/schemas/ScoreboardEntry" } }

